
<div class="row">
    <div class="col-md-4">
        <app-todo-form
        [selectedTodo]="selectedTodo"
        (todoSubmit)="todoSubmit($event)"
        (emitUpdate)="onUpdate($event)"
        ></app-todo-form>
       
    </div>
    <div class="col-md-8">
         <app-todo-list
         
         [todosArr]="todoArr"
         (emitEdit)="onEdit($event)"
         (emitRemove)="onRemove($event)"
         ></app-todo-list>
    </div>
</div>
