<div class="card">
  <div class="card-body">
   <h2 class="text-center">{{isineditmode?'Update Todo':'Add Todo'}}</h2>

    <form #todoForm="ngForm" (ngSubmit)="onSubmit()">

      <label for="title">Title*</label>
      <input
        type="text"
        required
        name="title"
        ngModel
        class="form-control">

      <label for="completed">Status</label>
      <select
        required
        name="completed"
        ngModel
        class="form-control mb-3">

        <option [ngValue]="true">Completed</option>
        <option [ngValue]="false">Pending</option>

      </select>

     
      <button
        *ngIf="!isineditmode"
        
        mat-raised-button
        color="primary">
        Add Todo
      </button>

    
      <button
        type="button"
        (click)="onUpdate()"
        *ngIf="isineditmode"
       
        mat-raised-button
        color="warn">
        Update Todo
      </button>

    </form>

  </div>
</div>
